<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B0D12" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Animated data visualizations and UI motion with D3.js, Apache ECharts, GSAP, React Spring, Motion and React Bits."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="preconnect" href="https://picsum.photos" crossorigin />
    <title>Interactive Data Visualization</title>
    <script>
      // Apply the stored theme before first paint to avoid a light/dark flash.
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('idv-theme') || 'system'
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
